[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweaver"
version = "1.0.0"
description = "Pure-Python, zero-dependency decentralized P2P async task broker for edge computing."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    { name = "MeshWeaver Engineering Team", email = "sujithkumarsingh422@gmail.com" }
]
keywords = [
    "distributed-systems",
    "p2p",
    "task-queue",
    "kademlia",
    "dht",
    "gossip-protocol",
    "edge-computing",
    "asyncio",
    "ed25519",
    "tls"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=12.0.0"]
cloudpickle = ["cloudpickle>=2.0.0"]
psutil = ["psutil>=5.8.0"]
enhanced = [
    "cloudpickle>=2.0.0",
    "psutil>=5.8.0",
    "rich>=12.0.0"
]
dev = [
    "cloudpickle>=2.0.0",
    "psutil>=5.8.0",
    "rich>=12.0.0"
]

[project.scripts]
meshweaver = "meshweaver_cli:main"
meshweaver-node = "cli:main"
